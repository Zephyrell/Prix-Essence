name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '^1.26'

      - name: Go vet
        run: go vet ./...

      - name: Tests
        run: go test ./... -count=1

      - name: Build Linux (amd64)
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o /tmp/prix-essence ./cmd/server

      - name: Vérif binaire statique
        run: file /tmp/prix-essence
